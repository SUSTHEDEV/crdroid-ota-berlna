name: OTA

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release asset and compute hashes
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          NAME=$(gh release view --json assets -q '.assets[0].name')
          gh release download "$TAG" -p '*.zip' -O rom.zip
          DEVICE=$(sed -E 's/^crDroidAndroid-[0-9.]+-[0-9]{8}-([a-z0-9_]+)-v[0-9.]+\.zip$/\1/' <<< "$NAME")
          [ -n "$DEVICE" ] && [ "$DEVICE" != "$NAME" ] || { echo "cannot derive device from '$NAME'" >&2; exit 1; }
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          {
            echo "device=${DEVICE}"
            echo "name=${NAME}"
            echo "url=${URL}"
            echo "ts=$(stat -c %Y rom.zip)"
            echo "size=$(stat -c %s rom.zip)"
            echo "md5=$(md5sum rom.zip | cut -d' ' -f1)"
            echo "sha=$(sha256sum rom.zip | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Update <device>.json
        env:
          DEVICE: ${{ steps.rel.outputs.device }}
          URL: ${{ steps.rel.outputs.url }}
          FILE: ${{ steps.rel.outputs.name }}
          SIZE: ${{ steps.rel.outputs.size }}
          MD5: ${{ steps.rel.outputs.md5 }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          F="${DEVICE}.json"
          if [ -f "$F" ]; then
            # refresh content fields only - timestamp is a build property and
            # stays owned by the build (release-ota.sh / $DEVICE.json)
            jq \
              --arg f "$FILE" --arg d "$URL" --arg s "$SIZE" \
              --arg m "$MD5" --arg h "$SHA" \
              '.response[0] |= (.filename=$f | .download=$d |
                                .size=($s|tonumber) | .md5=$m | .sha256=$h)' \
              "$F" > "$F.new" && mv "$F.new" "$F"
          else
            # first publish from CI alone - minimal manifest
            jq -n \
              --arg dev "$DEVICE" --arg f "$FILE" --arg d "$URL" --arg t "${{ steps.rel.outputs.ts }}" \
              --arg s "$SIZE" --arg m "$MD5" --arg h "$SHA" \
              '{response:[{maintainer:"",oem:"",device:"",filename:$f,download:$d,
                timestamp:($t|tonumber),md5:$m,sha256:$h,size:($s|tonumber),
                version:"",os_patch_level:"",os_sdk_level:0,buildtype:"Unofficial",
                forum:"",gapps:"",firmware:"",modem:"",bootloader:"",recovery:"",
                paypal:"",telegram:"",dt:"",common-dt:"",kernel:""}]}' > "$F"
          fi

      - name: Commit manifest
        env:
          DEVICE: ${{ steps.rel.outputs.device }}
          FILE: ${{ steps.rel.outputs.name }}
        run: |
          git config user.name "ota-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DEVICE}.json"
          git commit -m "OTA [${DEVICE}]: ${FILE}" || exit 0
          git push origin HEAD:main
